name: Build and release RLC+ WSL images

on:
  workflow_dispatch:
    inputs:
      rlcplus_version:
        description: "RLC+ version (9 or 10)"
        required: true
        type: choice
        options: ["9", "10"]
      build_tag:
        description: "Build tag, e.g. 20260806.0"
        required: true
        type: string
      amd64_qcow2_url:
        description: "Direct URL to the x86_64 GenericCloud qcow2 for this version"
        required: true
        type: string
      arm64_qcow2_url:
        description: "Direct URL to the aarch64 GenericCloud qcow2 for this version"
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libguestfs-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools

      - name: Select this arch's qcow2 URL
        id: select_url
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            echo "url=${{ inputs.amd64_qcow2_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ inputs.arm64_qcow2_url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download RLC+ GenericCloud qcow2
        run: |
          curl -fL -o rlcplus.qcow2 "${{ steps.select_url.outputs.url }}"

      - name: Extract rootfs with virt-tar-out
        run: |
          # GitHub-hosted runners have no KVM access, so force the slower
          # but dependency-free direct backend rather than assuming
          # hardware acceleration is available.
          LIBGUESTFS_BACKEND=direct virt-tar-out -a rlcplus.qcow2 / rootfs.tar

      - name: Unpack rootfs as root
        run: |
          # Must run as root: the tarball carries ownership/permission info
          # (e.g. /etc/shadow) that a non-root extract would silently mangle.
          mkdir -p rootfs
          sudo tar -xf rootfs.tar -C rootfs

      - name: Build .wsl image
        run: |
          sudo ./build/build.sh \
            --version "${{ inputs.rlcplus_version }}" \
            --arch "${{ matrix.arch }}" \
            --rootfs ./rootfs \
            --build-tag "${{ inputs.build_tag }}" \
            --out ./dist
          # dist/ was written by build.sh running as root via sudo; hand
          # ownership back to the runner user so later steps/artifacts work
          sudo chown -R "$(id -u):$(id -g)" ./dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rlcplus-${{ inputs.rlcplus_version }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact directories
        run: |
          mkdir -p release
          find dist -type f -exec mv {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rlcplus-${{ inputs.rlcplus_version }}-${{ inputs.build_tag }}
          name: "RLC+ ${{ inputs.rlcplus_version }} WSL image - ${{ inputs.build_tag }}"
          files: release/*
          # Pin these exact release asset URLs + the .CHECKSUM contents in
          # the microsoft/WSL DistributionInfo.json PR. Never point the
          # manifest at a floating "latest" URL - see README for why.
